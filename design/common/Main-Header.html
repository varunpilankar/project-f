<header class="site-header">
  <div class="header-inner">
    <div class="brand-group">
      <a href="#" class="brand-logo">
        <div class="logo-icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <span class="brand-name">LittleSprouts<span class="dot">.</span></span>
          <span class="brand-tagline">0 to 5 Years • Organic & Playful</span>
        </div>
      </a>
    </div>

    <!-- Age Bracket Shortcuts in Nav -->
    <div class="age-pills-nav">
      <span class="nav-label">Shop Age:</span>
      <div class="age-chips">
        <a href="#" class="age-chip">0–6M</a>
        <a href="#" class="age-chip">6–12M</a>
        <a href="#" class="age-chip">1–2Y</a>
        <a href="#" class="age-chip">3–5Y</a>
        <a href="#" class="age-chip active">Bundles 🎁</a>
      </div>
    </div>

    <!-- Search and Actions -->
    <div class="header-actions">
      <div class="search-bar-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="header-search-input" placeholder="Search organic onesies, teething toys..." />
      </div>

      <div class="user-action-buttons">
        <a href="#" class="icon-btn" title="Baby Registry & Wishlist">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="action-count">6</span>
        </a>

        <a href="#" class="icon-btn" title="My Account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>

        <!-- Cart Quick Button -->
        <button class="cart-trigger-btn">
          <div class="cart-icon-box">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span class="cart-badge">3</span>
          </div>
          <div class="cart-info-text">
            <span class="cart-label">Bag</span>
            <span class="cart-price">$89.00</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Category Nav Bar -->
  <nav class="category-subnav">
    <div class="subnav-inner">
      <a href="#" class="subnav-link">Clothing & Rompers</a>
      <a href="#" class="subnav-link">Montessori & Wooden Toys</a>
      <a href="#" class="subnav-link">Bedding & Swaddles</a>
      <a href="#" class="subnav-link">Mealtime & Teethers</a>
      <a href="#" class="subnav-link is-featured">✨ Curated Gift Sets</a>
      <a href="#" class="subnav-link is-active">Baby Registry Hub</a>
      <a href="#" class="subnav-link deals-pill">🏷️ Clearance Deals</a>
    </div>
  </nav>
</header>
